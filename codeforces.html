<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeForces User Info</title>
    <script src="CodeForcesJS.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header>
      <div id="codeforcesheader" class="has-text-centered mt-5 mb-3">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Codeforces_logo.svg/768px-Codeforces_logo.svg.png"
          alt="CodeForces Icon"
        />
      </div>
    </header>
    <form
      id="usernameform"
      class="box field is-grouped is-grouped-centered mt-3"
    >
      <div class="field is-horizontal">
        <div class="field-label is-normal">
          <label for="username" class="label">Username:</label>
        </div>
        <div class="field-body">
          <div class="field">
            <p class="control">
              <input
                type="text"
                class="input is-rounded is-focused is-normal"
                id="username"
                name="username"
                placeholder="Enter UserName"
              />
            </p>
          </div>
          <div class="field">
            <p class="control">
              <button class="button is-success is-rounded is-normal">
                Submit
              </button>
            </p>
          </div>
        </div>
      </div>

      <div class="field">
        <label class="label">Select Difficulty:</label>
        <div class="control">
          <div class="select is-rounded">
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium">Medium</option>
              <option value="hard">Hard</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="topic" class="label">Topic:</label>
        <div class="control">
          <div class="select is-rounded">
            <select id="topic-dropdown">
              <!-- Options will be added here dynamically -->
            </select>
          </div>
        </div>
      </div>
    </form>

    <div id="userInfo" class="container mt-5"></div>
    <div id="latestRating" class="container mt-5"></div>
    <div id="contestGraph" class="container mt-5"></div>
    <div id="analysis" class="container mt-5"></div>
    <div class="container">
      <h2 class="title is-4 has-text-centered">Solved Problems Heatmap</h2>
      <canvas id="heatmapCanvas"></canvas>
    </div>
  </body>
</html>
